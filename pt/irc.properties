joinLtRoom1GtRoom2Key1Key2=join &lt;sala1&gt;[,sala2][,…] [chave1[,chave2][,…]]:  Entrar num ou mais canais, opcionalmente fornecendo uma chave de canal para cada um se necessário.
kickLtNickGtMessageRemoveSomeone=kick &lt;nome&gt; [mensagem]:  Remove alguém do canal. Tem de ser um operador de canal para fazer isto.
listDisplayAListOfChatRooms=list:  Mostra uma lista de salas de conversa na rede. <i>Aviso: alguns servidores podem desligá-lo a seguir a fazer isto.</i>
