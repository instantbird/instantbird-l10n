msgLtNickGtLtMessageGt=msg &lt;nome&gt; &lt;mensagem&gt;:  Envia uma mensagem privada a um utilizador (em oposição a um canal).
namesChannelListTheUsersCurrentlyIn=names [canal]:  Lista os utilizadores que estão no canal.
nickLtNewNicknameGtChangeYour=nick &lt;novo nome&gt;:  Muda o seu nome.
nickservSendACommandToNickserv=nickserv:  Enviar um comando ao nickserv
opLtNick1GtNick2GrantChannel=op &lt;nome1&gt; [nome2] …:  Oferece estado de operador de canal a alguém. Tem de ser um operador de canal para fazer isto.
