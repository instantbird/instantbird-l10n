quitMessageDisconnectFromTheServerWith=quit [mensagem]:  Desligar do servidor, com uma mensagem opcional.
quoteSendARawCommandToThe=quote […]:  Enviar um comando ao servidor.
removeLtNickGtMessageRemoveSomeone=remove &lt;nome&gt; [mensagem]:  Remover alguém de uma sala. Tem de ser um operador de canal para fazer isto.
