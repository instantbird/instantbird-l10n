chanservSendACommandToChanserv=chanserv: Odošle príkaz na chanserv
deopLtNick1GtNick2RemoveChannel=deop &lt;prezývka1&gt; [prezývka2] …:  Odstráni vybranému používateľovi titul operátora kanálu. Aby ste mohli použiť tento príkaz, musíte byť operátor kanálu.
devoiceLtNick1GtNick2RemoveChannel=devoice &lt;prezývka1&gt; [prezývka2] …:  Odstráni používateľovi titul  voice a zabráni mu písanie, ak je kanál moderovaný (+m). Aby ste mohli použiť tento príkaz, musíte byť operátor kanálu.
inviteLtNickGtRoomInviteSomeone=invite &lt;prezývka&gt; [miestnosť]:  Pozve osobu, aby sa pridala do rozhovoru na zadanom kanáli, alebo na aktuálnom kanál.
jLtRoom1GtRoom2Key1Key2=j &lt;miestnosť1&gt;[,miestnosť2][,…] [kľúč1[,kľúč2][,…]]:  Vstúpi do jedného aleboviacerých kanálov a voliteľne poskytne pre každý kľúč kanála, ak to bude nutné.
joinLtRoom1GtRoom2Key1Key2=join &lt;room1&gt;[,room2][,…] [key1[,key2][,…]]:  Vstúpiť do jednoho alebo viacerých kanálov. Ak je to potrebné, zadajte aj kľúče pre jednotlivé kanály.
kickLtNickGtMessageRemoveSomeone=kick &lt;prezývka&gt; [správa]:  Odstráni osobu z kanálu. Toto môžu urobiť len operátori kanálu.
listDisplayAListOfChatRooms=list:  Zobrazí zoznam chatovacích miestností na sieti. <i>Upozornenie, niektoré servery vás môžu odpojiť.</i>
meLtActionToPerformGtPerform=me &lt;akcia, ktorú vykonať&gt;:  Vykoná akciu.
memoservSendACommandToMemoserv=memoserv: Odošle príkaz na memoserv
modeLtGtLtAZaZ=mode &lt;+|-&gt;&lt;A-Za-z&gt; &lt;prezývka|kanál&gt;:  Nastaví alebo odstaví režim kanála alebo používateľa.
msgLtNickGtLtMessageGt=msg &lt;prezývka&gt; &lt;správa&gt;:  Pošle súkromnú správu používateľovi (nie na kanáli).
namesChannelListTheUsersCurrentlyIn=names [kanál]:  Zobrazí názvy používateľov nachádzajúcich sa na kanáli.
nickLtNewNicknameGtChangeYour=nick &lt;nová prezývka&gt;:  Zmení vašu prezývku.
nickservSendACommandToNickserv=nickserv: Odošle príkaz na nickserv
noticeLtTargetLtSendANotice=notice &lt;cieľ&lt;:  Odošle používateľovi alebo kanálu upozornenie.
opLtNick1GtNick2GrantChannel=op &lt;prezývka1&gt; [prezývka2] …:  Udelí niekomu status operátora kanála. Aby ste mohli vykonať tento príkaz, musíte byť operátorom kanála.
operwallLtMessageGtIfYouDon=operwall &lt;správa&gt;:  Ak neviete, čo je toto, pravdepodobne to neviete používať.
operservSendACommandToOperserv=operserv: Odošle príkaz na operserv
partRoomMessageLeaveTheCurrentChannel=part [miestnosť] [správa]:  Opustí aktuálny kanál alebo určený kanál s voliteľnou správou.
pingNickAsksHowMuchLagA=ping [prezývka]:  Spýta sa, akú veľkú má používateľ časovú odozvu (alebo server, ak nie je určený používateľ).
queryLtNickGtLtMessageGt=query &lt;prezývka&gt; &lt;správa&gt;:  Pošle používateľovi súkromnú správu (bez ohľadu na kanál).
quitMessageDisconnectFromTheServerWith=quit [message]:  Odpojí zo servera s nepovinnou správou.
quoteSendARawCommandToThe=quote […]:  Odoslať na server príkaz raw.
removeLtNickGtMessageRemoveSomeone=remove &lt;prezývka&gt; [správa]:  Odstráni niekoho z miestnosti. Aby ste mohli vykonať tento príkaz, musíte byť operátorom kanála.
timeDisplaysTheCurrentLocalTimeAt=time: Zobrazí aktuálny lokálny čas na IRC serveri.
topicNewTopicViewOrChangeThe=topic [nová téma]:  Zobrazí alebo zmení tému kanálu.
umodeLtGtLtAZaZ=umode &lt;+|-&gt;&lt;A-Za-z&gt;:  Nastaví alebo odoberie režim používateľa.
versionNickSendCtcpVersionRequestTo=version [prezývka]: odošle používateľovi požiadavku CTCP VERSION
voiceLtNick1GtNick2GrantChannel=voice &lt;prezývka1&gt; [prezývka2] …:  Udelí niekomu status voice kanála. Aby ste mohli vykonať tento príkaz, musíte byť operátorom kanála.
wallopsLtMessageGtIfYouDon=wallops &lt;správa&gt;:  Ak neviete, čo tento príkaz robí, tak pravdepodobne ho neviete používať.
whoisServerLtNickGtGetInformation=whois [server] &lt;prezývka&gt;:  Zobrazí iformácie o používateľovi.
whowasLtNickGtGetInformationOn=whowas &lt;nick&gt;: Zobrazí informácie o používateľovi, ktorý sa odhlásil.
