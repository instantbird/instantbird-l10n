actionLtActionToPerformGtPerform=action &lt;acțiune de efectuat&gt;:  Efectuați o acțiune.
awayMessageSetAnAwayMessageOr=away [mesaj]:  Setați un mesaj în absență sau, dacă nu precizați un mesaj, reveniți din absență.
ctcpNickMsgSendsCtcpMsgTo=ctcp <pseudonim> <msg>: trimite un msg ctcp către pseudonimul ales.
chanservSendACommandToChanserv=chanserv:  Trimiteți o comandă către „chanserv”.
deopLtNick1GtNick2RemoveChannel=deop &lt;pseudonim1&gt; [pseudonim2] …:  Scoateți din lista operatorilor un utilizator. Pentru aceasta e nevoie să fiți operator.
devoiceLtNick1GtNick2RemoveChannel=devoice &lt;pseudonim1&gt;: [pseudonim2] …:  Împiedicați anumiți utilizatori să trimită mesaje într-un chat moderat (+m). Pentru aceasta e nevoie să fiți operator.
inviteLtNickGtRoomInviteSomeone=invite &lt;pseudonim&gt; [chat]:  Invitați pe cineva să vi se alăture în chat-ul curent sau într-altul specificat.
jLtRoom1GtRoom2Key1Key2=j &lt;chat1&gt;[,chat2][,…] [cheie1][,cheie2][,…]:  Intrați în unul sau mai multe chat-uri, opțional precizând o cheie pentru fiecare, dacă e necesar.
joinLtRoom1GtRoom2Key1Key2=join &lt;chat1&gt;[,chat2][,…] [cheie1[,cheie2][,…]]:  Intrați în unul sau mai multe chat-uri, opțional precizând o cheie pentru fiecare, dacă e necesar.
kickLtNickGtMessageRemoveSomeone=kick &lt;pseudonim&gt; [mesaj]: Dați pe cineva afară din chat. Pentru aceasta e nevoie să fiți operator.
listDisplayAListOfChatRooms=list:  Listează camerele de chat din rețea. <i>Atenție! Anumite servere vă vor deconecta la executarea acestei comenzi.</i>
meLtActionToPerformGtPerform=me &lt;acțiune de efectuat&gt;:  Efectuați o acțiune.
memoservSendACommandToMemoserv=memoserv:  Trimiteți o comandă către „memoserv”.
modeLtGtLtAZaZ=mode &lt;+|-&gt;&lt;A-Za-z&gt; &lt;pseudonim|chat&gt;:  Setați sau resetați un chat sau un mod utilizator.
msgLtNickGtLtMessageGt=msg &lt;pseudonim&gt; &lt;mesaj&gt;:  Trimiteți un mesaj privat către un utilizator (nu în camera de chat).
namesChannelListTheUsersCurrentlyIn=names [chat]:  Listați utilizatorii din chat.
nickLtNewNicknameGtChangeYour=nick &lt;pseudonim nou&gt;:  Schimbați pseudonimul propriu.
nickservSendACommandToNickserv=nickserv:  Trimiteți o comandă către „nickserv”.
noticeLtTargetLtSendANotice=me &lt;acțiune&gt;:  Trimite o notificare către un contact sau un chat.
opLtNick1GtNick2GrantChannel=op &lt;pseudonim1&gt; [pseudonim2] …:  Acordați status de operator unuia sau mai multor utilizatori. Pentru aceasta e nevoie să fiți operator.
operwallLtMessageGtIfYouDon=operwall &lt;mesaj&gt;:  Dacă nu știți ce face această comandă, mai bine nu o folosiți.
operservSendACommandToOperserv=operserv:  Trimiteți o comandă către „operserv”.
partRoomMessageLeaveTheCurrentChannel=part [chat] [mesaj]: Ieșiți din chat-ul curent (sau un altul specificat) cu un mesaj opțional.
pingNickAsksHowMuchLagA=ping [pseudonim]:  Verificați latența conexiunii unui utilizator (sau a serverului, dacă nu specificați un utilizator).
queryLtNickGtLtMessageGt=query &lt;pseudonim&gt; %lt;mesaj&gt;:  Trimiteți un mesaj privat către un utilizator (nu către un chat).
quitMessageDisconnectFromTheServerWith=quit [mesaj]:  Vă deconectați de la server cu un mesaj opțional.
quoteSendARawCommandToThe=quote […]:  Trimiteți o comandă brută către server.
removeLtNickGtMessageRemoveSomeone=remove &lt;pseudonim&gt; [mesaj]:  Scoateți un utilizator din chat. Pentru aceasta trebuie să fiți operator.
timeDisplaysTheCurrentLocalTimeAt=time: Arată ora locală a serverului IRC.
topicNewTopicViewOrChangeThe=topic [topic nou]:  Verificați sau schimbați subiectul chat-ului.
umodeLtGtLtAZaZ=umode &lt;+|-&gt;&lt;A-Za-z&gt;:  Setați sau resetați un mod utilizator.
versionNickSendCtcpVersionRequestTo=versiune [pseudonim]: trimite o cerere CTCP VERSION către un utilizator
voiceLtNick1GtNick2GrantChannel=voice &lt;pseudonim1&gt; [pseudonim2] …:  Acordați unui utilizator posibilitatea de a scrie ceva într-un chat moderat.
wallopsLtMessageGtIfYouDon=wallops &lt;mesaj&gt;:  Dacă nu știți ce face această comandă, mai bine nu nu o folosiți.
whoisServerLtNickGtGetInformation=whois [server] &lt;pseudonim&gt;:  Obțineți detalii despre un utilizator.
whowasLtNickGtGetInformationOn=whowas &lt;pseudonim&gt;:  Obțineți detalii despre un utilizator deconectat.
