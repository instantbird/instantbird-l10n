actionLtActionToPerformGtPerform=action &lt;acțiune de efectuat&gt;:  Efectuați o acțiune.
awayMessageSetAnAwayMessageOr=away [mesaj]:  Definiți un mesaj în absență sau, dacă nu precizați un mesaj, reveniți din absență.
ctcpNickMsgSendsCtcpMsgTo=ctcp <pseudonim> <msg>: trimite un msg ctcp către pseudonimul ales.
chanservSendACommandToChanserv=chanserv:  Trimiteți o comandă către „chanserv”.
deopLtNick1GtNick2RemoveChannel=deop &lt;pseudonim1&gt; [pseudonim2] …:  Scoateți un utilizator din lista operatorilor canalului. Pentru aceasta e nevoie să fiți operator.
devoiceLtNick1GtNick2RemoveChannel=devoice &lt;pseudonim1&gt;: [pseudonim2] …:  Împiedicați anumiți utilizatori să trimită mesaje într-un canal moderat (+m). Pentru aceasta e nevoie să fiți operator al canalului.
inviteLtNickGtRoomInviteSomeone=invite &lt;pseudonim&gt; [canal]:  Invitați pe cineva să vi se alăture în canalul curent sau într-altul specificat.
jLtRoom1GtRoom2Key1Key2=j &lt;canal1&gt;[,canal2][,…] [cheie1][,cheie2][,…]:  Intrați în unul sau mai multe canale, opțional precizând o cheie pentru fiecare, dacă e necesar.
joinLtRoom1GtRoom2Key1Key2=join &lt;canal1&gt;[,canal2][,…] [cheie1[,cheie2][,…]]:  Intrați în unul sau mai multe canale, opțional precizând o cheie pentru fiecare, dacă e necesar.
kickLtNickGtMessageRemoveSomeone=kick &lt;pseudonim&gt; [mesaj]: Dați pe cineva afară dintr-un canal. Pentru aceasta e nevoie să fiți operator al respectivului canal.
listDisplayAListOfChatRooms=list:  Listează canalele de chat din rețea. <i>Atenție! Anumite servere vă vor deconecta la executarea acestei comenzi.</i>
meLtActionToPerformGtPerform=me &lt;acțiune de efectuat&gt;:  Efectuați o acțiune.
memoservSendACommandToMemoserv=memoserv:  Trimiteți o comandă către „memoserv”.
modeLtGtLtAZaZ=mode &lt;+|-&gt;&lt;A-Za-z&gt; &lt;pseudonim|canal&gt;:  Inițializați sau reinițializați un canal ori un mod de utilizator.
msgLtNickGtLtMessageGt=msg &lt;pseudonim&gt; &lt;mesaj&gt;:  Trimiteți un mesaj privat către un utilizator (nu unul public în canal).
namesChannelListTheUsersCurrentlyIn=names [canal]:  Listați utilizatorii dintr-un canal.
nickLtNewNicknameGtChangeYour=nick &lt;pseudonim nou&gt;:  Schimbați pseudonimul propriu.
nickservSendACommandToNickserv=nickserv:  Trimiteți o comandă către „nickserv”.
noticeLtTargetLtSendANotice=me &lt;acțiune&gt;:  Trimite o notificare către un contact sau un canal.
opLtNick1GtNick2GrantChannel=op &lt;pseudonim1&gt; [pseudonim2] …:  Acordați status de operator unuia sau mai multor utilizatori. Pentru aceasta e nevoie să fiți operator al canalului.
operwallLtMessageGtIfYouDon=operwall &lt;mesaj&gt;:  Dacă nu știți ce face această comandă, mai bine nu o folosiți.
operservSendACommandToOperserv=operserv:  Trimiteți o comandă către „operserv”.
partRoomMessageLeaveTheCurrentChannel=part [canal] [mesaj]: Ieșiți din canalul curent (sau un altul specificat) cu un mesaj opțional.
pingNickAsksHowMuchLagA=ping [pseudonim]:  Verificați latența conexiunii unui utilizator (sau a serverului, dacă nu specificați un utilizator).
queryLtNickGtLtMessageGt=query &lt;pseudonim&gt; %lt;mesaj&gt;:  Trimiteți un mesaj privat către un utilizator (nu către un canal).
quitMessageDisconnectFromTheServerWith=quit [mesaj]:  Vă deconectați de la server cu un mesaj opțional.
quoteSendARawCommandToThe=quote […]:  Trimiteți o comandă brută către server.
removeLtNickGtMessageRemoveSomeone=remove &lt;pseudonim&gt; [mesaj]:  Scoateți un utilizator dintr-un canal. Pentru aceasta trebuie să fiți operator al respectivului canal.
timeDisplaysTheCurrentLocalTimeAt=time: Arată ora locală a serverului IRC.
topicNewTopicViewOrChangeThe=topic [subiect nou]:  Verificați sau schimbați subiectul canalului.
umodeLtGtLtAZaZ=umode &lt;+|-&gt;&lt;A-Za-z&gt;:  Inițializați sau reinițializați un mod pentru utilizator.
versionNickSendCtcpVersionRequestTo=versiune [pseudonim]: trimite o cerere CTCP VERSION către un utilizator
voiceLtNick1GtNick2GrantChannel=voice &lt;pseudonim1&gt; [pseudonim2] …:  Acordați unui utilizator posibilitatea de a scrie ceva într-un canal moderat. Trebuie să fiți operator al respectivului canal.
wallopsLtMessageGtIfYouDon=wallops &lt;mesaj&gt;:  Dacă nu știți ce face această comandă, mai bine nu nu o folosiți.
whoisServerLtNickGtGetInformation=whois [server] &lt;pseudonim&gt;:  Obțineți detalii despre un utilizator.
whowasLtNickGtGetInformationOn=whowas &lt;pseudonim&gt;:  Obțineți detalii despre un utilizator deconectat.
