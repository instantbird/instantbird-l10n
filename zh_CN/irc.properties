deopLtNick1GtNick2RemoveChannel=deop &lt;昵称1&gt; [昵称2]……：删除某人的管理员状态。您必须是频道管理员。
devoiceLtNick1GtNick2RemoveChannel=devoice &lt;昵称1&gt; [昵称2]……：删除某人的频道发言权，使其无法在频道被管理(+m)时说话。您必须是频道管理员。
inviteLtNickGtRoomInviteSomeone=invite &lt;昵称&gt; [聊天室]：邀请某人加入您指定的频道，或者当前频道。
jLtRoom1GtRoom2Key1Key2=j &lt;聊天室1&gt;[,聊天室][,……] [密钥1[,密钥2][,……]]：进入一个或多个频道，如需要的话可选提供频道密钥。
joinLtRoom1GtRoom2Key1Key2=join &lt;聊天室1&gt;[,聊天室][,……] [密钥1[,密钥2][,……]]：进入一个或多个频道，如需要的话可选提供频道密钥。
kickLtNickGtMessageRemoveSomeone=kick &lt;昵称&gt; [消息]：将某人踢出频道。您必须是频道管理员。
listDisplayAListOfChatRooms=list：显示网络上的聊天室列表。<i>警告，某些服务器可能因此而断开您的连接。</i>
meLtActionToPerformGtPerform=me &lt;要执行的动作&gt;：执行动作。
memoservSendACommandToMemoserv=memoserv：向 memoserv 发送命令
modeLtGtLtAZaZ=mode &lt;+|-&gt;&lt;A-Za-z&gt; &lt;昵称|频道&gt;：设置或取消频道或用户模式。
msgLtNickGtLtMessageGt=msg &lt;昵称&gt; &lt;消息&gt;：给用户发送私人消息。
namesChannelListTheUsersCurrentlyIn=name [频道]：列出频道中目前的用户。
nickLtNewNicknameGtChangeYour=nick &lt;新昵称&gt;：更改您的昵称。
nickservSendACommandToNickserv=nickserv：向 nickserv 发送命令
noticeLtTargetLtSendANotice=notice &lt;目标&gt;：向好友或频道发送提示。
opLtNick1GtNick2GrantChannel=op &lt;昵称1&gt; [昵称2]……：为某人授予频道管理员状态。您必须是频道管理员。
operwallLtMessageGtIfYouDon=operwall &lt;消息&gt;：如果您不知道这是什么功能，请不要使用。
operservSendACommandToOperserv=operserv：向 operserv 发送命令
partRoomMessageLeaveTheCurrentChannel=part [聊天室] [消息]：离开当前频道或指定频道，并留下可选的消息。
pingNickAsksHowMuchLagA=ping [昵称]：询问用户发了多长时间呆(若未指定用户则代表服务器)。
queryLtNickGtLtMessageGt=query &lt;昵称&gt; &lt;消息&gt;：给用户发送私人消息。
quitMessageDisconnectFromTheServerWith=quit [消息]：断开与服务器的连接，并留下可选的消息。
quoteSendARawCommandToThe=quot [……]：向服务器发送原始命令。
removeLtNickGtMessageRemoveSomeone=remove &lt;昵称&gt; [消息]：从聊天室踢除某人。您必须是频道管理员。
timeDisplaysTheCurrentLocalTimeAt=time：显示 IRC 服务器上当前的本地时间。
topicNewTopicViewOrChangeThe=topic [新话题]：查看或更改频道话题。
umodeLtGtLtAZaZ=umode &lt;+|-&gt;&lt;A-Za-z&gt;：设置或取消用户模式。
versionNickSendCtcpVersionRequestTo=version [昵称]：向用户发送 CTCP VERSION 请求
voiceLtNick1GtNick2GrantChannel=voice &lt;昵称1&gt; [昵称2] …：授予频道发言权。您必须是频道管理员。
