actionLtActionToPerformGtPerform=action &lt;zdarzenie do wykonania&gt;:  Wykonuje określone zdarzenie.
awayMessageSetAnAwayMessageOr=away [wiadomość]:  Ustawia komunikat nieobecności, albo powraca ze stanu nieobecności jeżeli użyto bez parametru.
chanservSendACommandToChanserv=chanserv: Wyślij polecenie do chanserv
deopLtNick1GtNick2RemoveChannel=deop &lt;ksywa1&gt; [ksywa2] …:  Usuwa uprawnienia operatora kanału z określonych osób. Aby używać tego polecenia, należy być operatorem kanału.
devoiceLtNick1GtNick2RemoveChannel=devoice &lt;ksywa1&gt; [ksywa2] …:  Usuwa prawo głosu z określonej osoby, uniemożliwiając jej rozmowę na moderowanym kanale (+m). Aby używać tego polecenia, należy być operatorem kanału.
inviteLtNickGtRoomInviteSomeone=invite &lt;ksywa&gt; [kanał-irc]:  Zaprasza podaną osobę na wybrany kanał, lub aktualny (jeżeli opcja [kanał-irc] nie zostanie podana).
jLtRoom1GtRoom2Key1Key2=j &lt;kanał1&gt;[,kanał2][,…] [klucz1[,klucz2][,…]]:  Powoduje przyłączenie się do jednego lub kilku kanałów-irc, dodatkowo można podać klucz dla każdego kanału, jeżeli jest potrzebny.
joinLtRoom1GtRoom2Key1Key2=join &lt;kanał1&gt;[,kanał2][,…] [klucz1[,klucz2][,…]]:  Powoduje przyłączenie się do jednego lub kilku kanałów-irc, dodatkowo można podać klucz dla każdego kanału, jeżeli jest potrzebny.
kickLtNickGtMessageRemoveSomeone=kick &lt;ksywa&gt; [komunikat]:  Usuwa określoną osobę z kanału irc. Aby używać tego polecenia, należy być operatorem kanału.
listDisplayAListOfChatRooms=list:  Wyświetla listę kanałów IRC w sieci. <i>Uwaga: niektóre serwery mogą cię rozłączyć po wykonaniu tego polecenia.</i>
meLtActionToPerformGtPerform=me &lt;akcja do wykonania&gt;:  Wykonuje określoną akcję.
memoservSendACommandToMemoserv=memoserv: Wyślij polecenie do memoserv
modeLtGtLtAZaZ=mode &lt;+|-&gt;&lt;A-Za-z&gt; &lt;ksywka|kanał&gt;:  Dodaje lub zdejmuje uprawnienia na kanale.
msgLtNickGtLtMessageGt=msg &lt;ksywa&gt; &lt;wiadomość&gt;:  Wysyła prywatną wiadomość do użytkownika (nie będzie wyświetlona na kanale).
namesChannelListTheUsersCurrentlyIn=names [kanał-irc]:  Wyświetla wszystkich użytkowników na aktualnym kanale.
nickLtNewNicknameGtChangeYour=nick &lt;nowa ksywa&gt;:  Zmienia ksywę.
nickservSendACommandToNickserv=nickserv: Wyślij polecenie do nickserv
opLtNick1GtNick2GrantChannel=op &lt;ksywa1&gt; [ksywa2] …:  Nadaje określonej osobie status operatora kanału. Aby używać tego polecenia, należy być operatorem kanału.
operwallLtMessageGtIfYouDon=operwall &lt;wiadomość&gt;:  Jeżeli nie wiesz co to jest, to prawdopodobnie nie możesz tego używać.
operservSendACommandToOperserv=operserv: Wyślij polecenie do operserv
partRoomMessageLeaveTheCurrentChannel=part [kanał-irc] [komunikat]:  Powoduje wyjście z aktualnego lub wybranego kanału, dodatkowo  można ustawić komunikat wyjścia.
pingNickAsksHowMuchLagA=ping [ksywa]:  Sprawdza jakie jest opóźnienie pomiędzy użytkownikiem lub serwerem (jeżeli nie podano użytkownika).
queryLtNickGtLtMessageGt=query &lt;ksywa&gt; &lt;wiadomość&gt;:  Wysyła prywatną wiadomość do użytkownika (nie będzie wyświetlona na kanale).
quitMessageDisconnectFromTheServerWith=quit [komunikat]: Przerywa połączenie z serwerem z opcjonalnym komunikatem.
quoteSendARawCommandToThe=quote […]:  Wysyła polecenie bezpośrednio do serwera.
removeLtNickGtMessageRemoveSomeone=remove &lt;ksywa&gt; [wiadomość]:  Usuwa określoną osobę z kanału. Aby używać tego polecenia, należy być operatorem kanału.
timeDisplaysTheCurrentLocalTimeAt=time: Wyświetla bieżący czas lokalne danego serwera IRC.
topicNewTopicViewOrChangeThe=topic [nowy temat]:  Wyświetla lub zmienia temat kanału.
umodeLtGtLtAZaZ=umode &lt;+|-&gt;&lt;A-Za-z&gt;:  Zmienia ustawienia trybu użytkownika.
versionNickSendCtcpVersionRequestTo=version [ksywka]: wysyła zapytanie CTCP VERSION do określonego użytkownika
voiceLtNick1GtNick2GrantChannel=voice &lt;ksywa1&gt; [ksywa2] …:  Przyznaje prawo głosu określonej osobie. Aby używać tego polecenia, należy być operatorem kanału.
wallopsLtMessageGtIfYouDon=wallops &lt;wiadomość&gt;:  Jeżeli nie wiesz co robi to polecenie, to prawdopodobnie nie możesz go użyć.
whoisServerLtNickGtGetInformation=whois [serwer] &lt;ksywka&gt;:  Pobiera informacje o użytkowniku
whowasLtNickGtGetInformationOn=whois [serwer] &lt;ksywka&gt;:  Pobiera informacje o użytkowniku
