actionLtActionToPerformGtPerform=action &lt;дія для виконання&gt;:  Виконати дію.
awayMessageSetAnAwayMessageOr=away [повідомлення]:  Встановити повідомлення про відсутність. Якщо повідомлення не задане, видалити повідомлення про відсутність.
ctcpNickMsgSendsCtcpMsgTo=ctcp <nick> <msg>: надсилає ctcp msg до контакту.
chanservSendACommandToChanserv=chanserv: Надіслати команду до chanserv
deopLtNick1GtNick2RemoveChannel=deop &lt;прізвисько1&gt; [прізвисько2] …:  Забрати у користувача стан оператора каналу. Для цього необхідно бути оператором каналу.
devoiceLtNick1GtNick2RemoveChannel=devoice &lt;прізвисько1&gt; [прізвисько2] …:  Забрати у користувача стан голосу на каналі, позбавивши його можливості говорити, якщо канал модерований (+m). Для цього необхідно бути оператором каналу.
inviteLtNickGtRoomInviteSomeone=invite &lt;прізвисько&gt; [кімната]:  Запросити користувача приєднатися до вас на вказаному або поточному каналі.
jLtRoom1GtRoom2Key1Key2=j &lt;кімната1&gt;[,кімната2][,…] [key1[,key2][,…]]:  Введіть один або більше каналів, при необхідності, можна вказати ключ каналу.
joinLtRoom1GtRoom2Key1Key2=join &lt;кімната1&gt;[,кімната2][,…] [key1[,key2][,…]]:  Введіть один або більше каналів, при необхідності, можна вказати ключ каналу..
kickLtNickGtMessageRemoveSomeone=kick &lt;прізвисько&gt; [повідомлення]:  Видалити користувача з каналу. Для цього необхідно бути оператором каналу.
listDisplayAListOfChatRooms=list:  Вивести перелік кімнат балачок у мережі. <i>Зауважте, деякі сервери через це можуть розірвати з'єднання з вами.</i>
meLtActionToPerformGtPerform=me &lt;дія для виконання&gt;:  Виконати дію.
memoservSendACommandToMemoserv=memoserv: Надіслати команду до memoserv
modeLtGtLtAZaZ=mode &lt;+|-&gt;&lt;A-Za-z&gt; &lt;прізвисько|канал&gt;:  Встановити чи зняти режим користувача чи каналу.
msgLtNickGtLtMessageGt=msg &lt;прізвисько&gt; &lt;повідомлення&gt;:  Надіслати приватне повідомлення користувачу (на відміну від повідомлення у канал).
namesChannelListTheUsersCurrentlyIn=names [канал]:  Вивести перелік присутніх на каналі користувачів.
nickLtNewNicknameGtChangeYour=nick &lt;нове прізвисько&gt;:  Змінити власне прізвисько.
nickservSendACommandToNickserv=nickserv: Надіслати команду до nickserv
noticeLtTargetLtSendANotice=notice &lt;target&lt;:  надіслати сповіщення користувачеві або каналу.
opLtNick1GtNick2GrantChannel=op &lt;прізвисько1&gt; [прізвисько2] …:  Дати користувачу статус оператора каналу. Для цього необхідно бути оператором каналу.
operwallLtMessageGtIfYouDon=operwall &lt;повідомлення&gt;:  Якщо ви не знаєте, що це таке, вам, можливо, не слід це використовувати.
operservSendACommandToOperserv=operserv: надіслати команду до operserv
partRoomMessageLeaveTheCurrentChannel=part [кімната] [повідомлення]:  Залишити поточний канал, або окремий канал. Повідомлення необов'язкове.
pingNickAsksHowMuchLagA=ping [прізвище]:  Запитати величину затримки зв'язку з користувачем (або з сервером, якщо користувач не вказаний).
queryLtNickGtLtMessageGt=query &lt;прізвисько&gt; &lt;повідомлення&gt;:  Надіслати користувачу приватне повідомлення (на відміну від повідомлення у канал).
quitMessageDisconnectFromTheServerWith=quit [повідомлення]:  Розірвати з'єднання з сервером. Повідомлення необов'язкове.
quoteSendARawCommandToThe=quote […]:  Надіслати серверу команду без обробки.
removeLtNickGtMessageRemoveSomeone=remove &lt;прізвисько&gt; [повідомлення]:  Видалити користувача з кімнати. Для цього необхідно бути оператором каналу.
timeDisplaysTheCurrentLocalTimeAt=time: Відображає локальний час на сервері IRC.
topicNewTopicViewOrChangeThe=topic [нова тема]:  Переглянути або змінити тему на каналі.
umodeLtGtLtAZaZ=umode &lt;+|-&gt;&lt;A-Za-z&gt;:  Встановити або зняти режим користувача.
versionNickSendCtcpVersionRequestTo=version [nick]: надіслана запитана користувачем CTCP VERSION
voiceLtNick1GtNick2GrantChannel=voice &lt;прізвисько1&gt; [прізвисько2] …:  Надати користувачу статус голосу на каналі. Для цього потрібно бути оператором каналу.
wallopsLtMessageGtIfYouDon=wallops &lt;повідомлення&gt;:  Якщо ви не знаєте, що це таке, вам, можливо, не слід це використовувати.
whoisServerLtNickGtGetInformation=whois [сервер] &lt;прізвисько&gt;:  Отримати відомості про користувача.
whowasLtNickGtGetInformationOn=whowas &lt;nick&gt;: отримати відомості про користувача, що вийшов.
replyTimeFromSeconds=Час відгуку від %s: %lu секунд
pong=PONG
ctcpPingReply=Відповідь CTCP PING
