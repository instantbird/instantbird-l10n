chanservSendACommandToChanserv=chanserv: gửi một câu lệnh cho trình phục vụ kênh
deopLtNick1GtNick2RemoveChannel=deop &lt;tên_hiệu1&gt; [tên_hiệu2] …:  Loại bỏ trạng thái người điều hành kênh khỏi ai đó. Bạn phải là một người điều hành kênh để làm điều này.
devoiceLtNick1GtNick2RemoveChannel=devoice &lt;tên_hiệu1&gt; [tên_hiệu2] …:  Loại bỏ trạng thái thoại trong kênh khỏi ai đó, ngăn họ trò chuyện nếu kênh được đặt (+m). Bạn phải là một người điều hành kênh để làm điều này.
inviteLtNickGtRoomInviteSomeone=invite &lt;tên_hiệu&gt; [phòng]:  Mời bạn hữu tham gia kênh đã ghi rõ, hay kênh hiện tại.
jLtRoom1GtRoom2Key1Key2=j &lt;phòng1&gt;[,phòng2][,…] [khoá1[,khoá2][,…]]:  Nhập vào một hay nhiều kênh, tùy chọn cung cấp một khoá cho mỗi kênh nếu cần.
joinLtRoom1GtRoom2Key1Key2=join &lt;phòng1&gt;[,phòng2][,…] [khoá1[,khoá2][,…]]:  Vào một hay nhiều kênh, tùy chọn cung cấp một khoá cho mỗi kênh nếu cần.
kickLtNickGtMessageRemoveSomeone=kick &lt;tên_hiệu&gt; [thông_điệp]: Loại bỏ ai đó khỏi một kênh. Bạn phải là người điều hành kênh để làm điều này.
listDisplayAListOfChatRooms=list: hiển thị danh sách các phòng trò chuyện nằm trên mạng này. <i>Cảnh báo : một số máy phục vụ có thể ngắt kết nối khi bạn làm điều này.</i>
meLtActionToPerformGtPerform=me &lt;hành động cần làm&gt;:  Thực hiện một hành động
memoservSendACommandToMemoserv=memoserv: gửi lệnh cho trình phục vụ ghi nhớ (memoserv)
modeLtGtLtAZaZ=mode &lt;+|-&gt;&lt;A-Za-z&gt; &lt;tên_hiệu|kênh&gt;:  Đặt hay bỏ đặt một kênh hay chế độ người dùng.
msgLtNickGtLtMessageGt=msg &lt;tên_hiệu&gt; &lt;thông_điệp&gt;:  Gửi một tin nhẳn riêng cho một người dùng (thay vì gửi đến cả kênh)
namesChannelListTheUsersCurrentlyIn=names [kênh]:  Liệt kê danh sách người dùng đang trong một kênh.
nickLtNewNicknameGtChangeYour=nick &lt;tên hiệu mới&gt;:  Đổi tên hiệu.
nickservSendACommandToNickserv=nickserv: Gửi lệnh cho trình phục vụ tên hiệu (nickserv)
noticeLtTargetLtSendANotice=notice &lt;đích&lt;:  Gửi thông báo cho một người dùng hay kênh.
opLtNick1GtNick2GrantChannel=op &lt;tên_hiệu1&gt; [tên_hiệu2] …:  Tặng trạng thái người điều hành kênh cho bạn khác. Bạn phải là người điều hành kênh để làm việc này.
operwallLtMessageGtIfYouDon=operwall &lt;thông_điệp&gt;: Nếu bạn không biết điều này nghĩa là gì, bạn có lẽ không thể dùng nó.
operservSendACommandToOperserv=operserv: gửi lệnh cho trình phục vụ người điều hành (operserv)
partRoomMessageLeaveTheCurrentChannel=part [phòng] [thông_điệp]: Rời khỏi kênh hiện tại, hay một kênh nào đó, tùy chọn để lại một thông điệp.
pingNickAsksHowMuchLagA=ping [tên_hiệu]: Hỏi một thời gian trễ của người dùng (hay máy phục vụ nếu không xác định tên người dùng cụ thể).
queryLtNickGtLtMessageGt=query &lt;tên_hiệu&gt; &lt;thông_điệp&gt;: Gởi một thông điệp riêng cho người dùng (thay vì gửi đến cả kênh)
quitMessageDisconnectFromTheServerWith=quit [thông_điệp]:  Ngưng kết nối với máy phục vụ, kèm theo một thông báo tuỳ chọn.
quoteSendARawCommandToThe=quote […]:  Gởi một dòng lệnh thô đến máy phục vụ.
removeLtNickGtMessageRemoveSomeone=remove &lt;tên_hiệu&gt; [thông_điệp]: Loại bỏ một người ra khỏi phòng. Bạn phải là người điều hành kênh để làm điều này.
timeDisplaysTheCurrentLocalTimeAt=time: Hiển thị thời gian hiện tại của máy phục vụ IRC.
topicNewTopicViewOrChangeThe=topic [chủ đề mới]:  Xem hay thay đổi chủ đề kênh.
umodeLtGtLtAZaZ=umode &lt;+|-&gt;&lt;A-Za-z&gt;:  Đặt hay bỏ chế độ người dùng.
versionNickSendCtcpVersionRequestTo=version [tên_hiệu]: gửi cho người dùng một yêu cầu CTCP VERSION
voiceLtNick1GtNick2GrantChannel=voice &lt;tên_hiệu1&gt; [tên_hiệu2] …:  Tặng trạng thái thoại trong kênh cho người khác. Bạn phải là người điều hành kênh để làm điều này.
wallopsLtMessageGtIfYouDon=wallops &lt;thông_điệp&gt;:  Nếu bạn không biết điều này nghĩa là gì, bạn có lẽ không thể dùng nó.
whoisServerLtNickGtGetInformation=whois [máy_phục_vụ] &lt;tên_hiệu&gt;:  Thu thập thông tin về một người dùng.
whowasLtNickGtGetInformationOn=whowas &lt;tên_hiệu&gt;: Thu thập thông tin về một người dùng đã đăng xuất.
