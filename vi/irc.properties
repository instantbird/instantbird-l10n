actionLtActionToPerformGtPerform=action &lt;việc cần làm&gt;:  Thực hiện một hành động.
awayMessageSetAnAwayMessageOr=away [thông điệp]:  Đặt một thông báo đi vắng, hay không dùng thông điệp để trở lại sau khi đi vắng.
