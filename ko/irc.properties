actionLtActionToPerformGtPerform=action &lt;실행할 동작&gt;:  동작을 실행합니다.
awayMessageSetAnAwayMessageOr=away [메시지]:  자리 비움 메시지를 설정합니다. 또는 자리 비움으로부터 돌아온 것을 표시하기 위해 설정한 메시지를 해제합니다.
chanservSendACommandToChanserv=chanserv: 명령을 chanserv 로 전송합니다.
deopLtNick1GtNick2RemoveChannel=deop &lt;별명1&gt; [별명2] …:  채널 조작권을 박탈합니다. 이 명령은 채널 조작권을 가지고 있어야 실행할 수 있습니다.
devoiceLtNick1GtNick2RemoveChannel=devoice &lt;별명1&gt; [별명2] …:  채널 조작권을 박탈하고, 채널이 모더레이트 (+m) 된 경우에 발언하지 않도록 합니다. 이 명령은 채널 조작권을 가지고 있어야 실행할 수 있습니다.
inviteLtNickGtRoomInviteSomeone=invite &lt;별명&gt; [대화실]:  지정한 채널 또는 현재의 채널로 초대합니다.
jLtRoom1GtRoom2Key1Key2=j &lt;대화실1&gt;[,대화실2][,…] [키1[,키2][,…]]:  하나 이상의 채널을 지정하면, 필요에 따라 추가되어 각각의 채널 키를 제공합니다.
joinLtRoom1GtRoom2Key1Key2=join &lt;대화실1&gt;[,대화실2][,…] [키1[,키2][,…]]:  하나 이상의 채널을 지정하면, 필요에 따라 추가되어 각각의 채널 키를 제공합니다.
kickLtNickGtMessageRemoveSomeone=kick &lt;별명&gt; [메시지]:  채널로부터 퇴출시킵니다. 이 명령은 채널 조작권을 가지고 있어야 실행할 수 있습니다.
listDisplayAListOfChatRooms=list:  네트워크 상의 대화실 목록을 표시합니다. <i>경고: 이것을 수행하면 접속을 끊는 서버가 있을 수 있습니다.</i>
meLtActionToPerformGtPerform=me &lt;실행할 동작&gt;:  지정한 동작을 실행합니다.
memoservSendACommandToMemoserv=memoserv: 명령을 memoserv 로 전송합니다.
modeLtGtLtAZaZ=mode &lt;+|-&gt;&lt;A-Za-z&gt; &lt;별명|채널&gt;:  채널 또는 사용자 모드를 설정/해제합니다.
msgLtNickGtLtMessageGt=msg &lt;별명&gt; &lt;메시지&gt;:  어느 사용자에게 (채널과 별도로) 개인 메시지를 보냅니다.
namesChannelListTheUsersCurrentlyIn=names [채널]:  채널에 현재 있는 사용자 목록을 표시합니다.
nickLtNewNicknameGtChangeYour=nick &lt;새 별명&gt;:  별명을 변경합니다.
nickservSendACommandToNickserv=nickserv: 명령을 nickserv 로 전송합니다.
opLtNick1GtNick2GrantChannel=op &lt;별명1&gt; [별명2] …:  채널 조작권을 부여합니다. 이 명령은 채널 조작권을 가지고 있어야 실행할 수 있습니다.
operwallLtMessageGtIfYouDon=operwall &lt;메시지&gt;:  이 명령이 무엇을 수행하는 지 모를 경우에는 아마도 사용할 일이 없을 것 입니다.
operservSendACommandToOperserv=operserv: 명령을 operserv 로 전송합니다.
partRoomMessageLeaveTheCurrentChannel=part [대화실] [메시지]:  현재의 채널 또는 지정한 채널로부터 메시지를 남기고 퇴장합니다.
pingNickAsksHowMuchLagA=ping [별명]:  사용자 (또는 사용자가 지정하지 않은 경우에는 서버) 와 어느 정도 지연이 있는지 질의합니다.
queryLtNickGtLtMessageGt=query &lt;별명&gt; &lt;메시지&gt;:  어느 사용자에게 (채널과는 별도로) 개인 메시지를 보냅니다.
quitMessageDisconnectFromTheServerWith=quit [메시지]:  메시지를 남기고 서버와의 접속을 끊습니다.
quoteSendARawCommandToThe=quote […]:  서버에 저수준 명령을 보냅니다.
removeLtNickGtMessageRemoveSomeone=remove &lt;별명&gt; [메시지]:  대화실로부터 별명의 사람을 퇴출시킵니다. 이 명령은 채널 조작권을 가지고 있어야 실행할 수 있습니다.
timeDisplaysTheCurrentLocalTimeAt=time: IRC 서버의 현재 시각 (로컬 타임) 을 표시합니다.
topicNewTopicViewOrChangeThe=topic [새 주제]:  채널 주제를 표시하거나 변경합니다.
umodeLtGtLtAZaZ=umode &lt;+|-&gt;&lt;A-Za-z&gt;:  사용자 모드를 설정 또는 해제합니다.
versionNickSendCtcpVersionRequestTo=version [별명]: 사용자에게 CTCP VERSION 요청을 보냅니다.
voiceLtNick1GtNick2GrantChannel=voice &lt;별명1&gt; [별명2] …:  채널 음성 권한을 부여합니다. 이 명령은 채널 조작권을 가지고 있어야 실행할 수 있습니다.
wallopsLtMessageGtIfYouDon=wallops &lt;메시지&gt;:  이 명령이 무엇을 수행하는 지 모를 경우에는 아마도 사용할 일이 없을 것 입니다.
whoisServerLtNickGtGetInformation=whois [서버명] &lt;별명&gt;:  사용자 정보를 가져옵니다.
