actionLtActionToPerformGtPerform=action &lt;дејство за извршување&gt;:  Изврши дејство.
awayMessageSetAnAwayMessageOr=away [порака]:  Испрати порака за отсуство или не корисни порака за враќање одотсуство.
chanservSendACommandToChanserv=chanserv: Испратете команда на chanserv
deopLtNick1GtNick2RemoveChannel=deop &lt;nick1&gt; [nick2] …:  Отстрани го оператоскиот статус од некого. Мора да имате операторски статус за да го направите тоа.
devoiceLtNick1GtNick2RemoveChannel=devoice &lt;nick1&gt; [nick2] …:  Отстрани го статусот за глас од некого, со што се спречува да зборува ако каналот е модериран (+m). Мора да бидете оператор на канал за да го направите ова.
inviteLtNickGtRoomInviteSomeone=invite &lt;прекар&gt; [соба]:  Покани некого да се придружи кон одредениотканал или тековниот канал.
jLtRoom1GtRoom2Key1Key2=j &lt;соба1&gt;[,соба2][,…] [клуч1[,клуч2][,…]]:  Влези во еден или повеќеканали, опционално обезбедувајќи клуч за секој ако е потребно.
joinLtRoom1GtRoom2Key1Key2=join &lt;соба1&gt;[,соба2][,…] [клуч1[,клуч2][,…]]:  Влези во еден или повеќеканали, опционално обезбедувајќи клуч за секој ако е потребно.
kickLtNickGtMessageRemoveSomeone=kick &lt;прекар&gt; [порака]:  Отстрани некого од канал. Мора да бидете оператор на канал за да го направите тоа.
listDisplayAListOfChatRooms=list:  Прикажи листа со соби за разговор на мрежата. <i>Предупредување, некои сервери можат да Ве исклучат ако го сторите ова.</i>
meLtActionToPerformGtPerform=me &lt;дејство за извршување&gt;:  Изврши дејство.
memoservSendACommandToMemoserv=memoserv: Испратете команда до memoserv
modeLtGtLtAZaZ=mode &lt;+|-&gt;&lt;A-Za-z&gt; &lt;прекар|канал&gt;:  Постави или исклучи го корисничкиот режим.
msgLtNickGtLtMessageGt=msg &lt;прекар&gt; &lt;порака&gt;:  Испратете приватна порака до корисник (наместодо канал).
namesChannelListTheUsersCurrentlyIn=names [канал]:  Ги листа корисниците кои моментално се на каналот
nickLtNewNicknameGtChangeYour=nick &lt;нов прекар&gt;:  Го променува Вашиот прекар.
nickservSendACommandToNickserv=nickserv: Испратете команда до nickserv
noticeLtTargetLtSendANotice=notice &lt;target&lt;:  Испрати известување на корисник или канал.
opLtNick1GtNick2GrantChannel=op &lt;прекар1&gt; [прекар2] …:  Додели статус на оператор некому. Мора да сте оператор на канал за да го извршите ова.
operwallLtMessageGtIfYouDon=operwall &lt;порака&gt;:  Ако не знаете ова што значи, најверојатно немада можете да го употребите.
operservSendACommandToOperserv=operserv: Испратете команда до operserv
partRoomMessageLeaveTheCurrentChannel=part [соба] [порака]:  Напушти го тековниот канал или одреден каналсо опционална порака.
pingNickAsksHowMuchLagA=ping [прекар]:  Прашува колкаво задоцнување има корисникот (илисерверот, ако не е одреден корисник).
queryLtNickGtLtMessageGt=query &lt;прекар&gt; &lt;порака&gt;:  Испрати приватна порака до корисник (наместодо канал).
quitMessageDisconnectFromTheServerWith=quit [порака]:  Исклучи се од серверот со опционална порака.
quoteSendARawCommandToThe=quote […]:  Испрати чиста команда до серверот.
removeLtNickGtMessageRemoveSomeone=remove &lt;прекар&gt; [порака]:  Отстрани некого од соба. Мора да бидетеоператор на канал за да го направите ова.
timeDisplaysTheCurrentLocalTimeAt=time: Го прикажува тековното локално време на IRC серверот.
topicNewTopicViewOrChangeThe=topic [нов наслов]:  Прегледај или промени го насловот на каналот.
umodeLtGtLtAZaZ=umode &lt;+|-&gt;&lt;A-Za-z&gt;:  Постави го или тргни го корисничкиот режим.
versionNickSendCtcpVersionRequestTo=version [nick]: испрати CTCP VERSION барање до некој корисник
voiceLtNick1GtNick2GrantChannel=voice &lt;nick1&gt; [nick2] …:  Додели некому статус за глас. Мора да сте оператор на каналот за да го направите ова.
wallopsLtMessageGtIfYouDon=wallops &lt;message&gt;:  Ако не знаете што е ова, најверојатно не можете да го користите.
whoisServerLtNickGtGetInformation=whois [сервер] &lt;прекар&gt;:  Собери информации за корисник.
whowasLtNickGtGetInformationOn=whowas &lt;nick&gt;: Добијте информации за корисник кој што се одјавил.
