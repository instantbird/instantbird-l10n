actionLtActionToPerformGtPerform=action &lt;действие для выполнения&gt;:  Выполнить действие.
authservSendACommandToAuthserv=authserv: Послать команду в authserv
awayMessageSetAnAwayMessageOr=away [сообщение]:  Установить сообщение об отсутствии. Если сообщение не задано, удалить сообщение об отсутствии.
ctcpNickMsgSendsCtcpMsgTo=ctcp <nick> <msg>: отправляет ctcp msg для ника.
chanservSendACommandToChanserv=chanserv: Послать команду для chanserv
deopLtNick1GtNick2RemoveChannel=deop &lt;псевдоним1&gt; [псевдоним2] …:  Забрать у пользователя статус оператора канала. Вы должны быть оператором канала для этого.
devoiceLtNick1GtNick2RemoveChannel=devoice &lt;псевдоним1&gt; [псевдоним2] …:  Забрать у пользователя статус голоса на канале, лишая его возможности говорить, если канал модерируемый (+m). Вы должны быть оператором канала для этого.
inviteLtNickGtRoomInviteSomeone=invite &lt;псевдоним&gt; [комната]:  Пригласить пользователя присоединиться к вам на указанном или текущем канале.
jLtRoom1GtRoom2Key1Key2=j &lt;room1&gt;[,room2][,…] [key1[,key2][,…]]:  Введите один или более каналов, указывая ключ канала, если требуется.
joinLtRoom1GtRoom2Key1Key2=подсоединиться &lt;room1&gt;[,room2][,…] [key1[,key2][,…]]:  Введите один или более каналов, указывая ключ канала, если требуется.
kickLtNickGtMessageRemoveSomeone=kick &lt;псевдоним&gt; [сообщение]:  Удалить пользователя с канала. Вы должны быть оператором канала для этого.
listDisplayAListOfChatRooms=list:  Вывести список комнат чата в сети. <i>Имейте в виду, что некоторые серверы за это могут разорвать соединение с вами.</i>
meLtActionToPerformGtPerform=me &lt;действие для выполнения&gt;:  Выполнить действие.
memoservSendACommandToMemoserv=memoserv: Послать команду для memoserv
modeLtGtLtAZaZ=mode &lt;+|-&gt;&lt;A-Za-z&gt; &lt;псевдоним|канал&gt;:  Установить или снять режим пользователя или канала.
msgLtNickGtLtMessageGt=msg &lt;nick&gt; &lt;message&gt;:  Послать частное сообщение пользователю как противоположность каналу).
namesChannelListTheUsersCurrentlyIn=names [канал]:  Вывести список пользователей, присутствующих сейчас на канале.
nickLtNewNicknameGtChangeYour=nick &lt;новый псевдоним&gt;:  Изменить свой псевдоним.
nickservSendACommandToNickserv=nickserv: Послать команду для nickserv
noticeLtTargetLtSendANotice=заметка &lt;target&lt;:  Отправить заметку пользователю или каналу.
opLtNick1GtNick2GrantChannel=op &lt;псевдоним1&gt; [псевдоним2] …:  Дать пользователю статус оператора канала. Вы должны быть оператором канала для этого.
operwallLtMessageGtIfYouDon=operwall &lt;message&gt;:  Если вы не знаете, что это, вероятно вы не сможете это использовать.
operservSendACommandToOperserv=operserv: Послать команду для operserv
partRoomMessageLeaveTheCurrentChannel=part [комната] [сообщение]:  Покинуть указанный или текущий канал. Сообщение не обязательно.
pingNickAsksHowMuchLagA=ping [псевдоним]:  Запросить величину задержки связи с пользователем (или с сервером, если пользователь не указан).
queryLtNickGtLtMessageGt=очередь &lt;nick&gt; &lt;message&gt;:  Послать частное сообщение пользователю (как противоположность каналу).
quitMessageDisconnectFromTheServerWith=quit [сообщение]:  Разорвать соединение с сервером. Сообщение не обязательно.
quoteSendARawCommandToThe=quote […]:  Послать команду без обработки непосредственно серверу.
removeLtNickGtMessageRemoveSomeone=remove &lt;псевдоним&gt; [сообщение]:  Удалить пользователя из комнаты. Вы должны быть оператором канала для этого.
timeDisplaysTheCurrentLocalTimeAt=time: Выводит текущее локальное время на сервере IRC.
topicNewTopicViewOrChangeThe=topic [новая тема]:  Просмотреть или изменить тему канала.
umodeLtGtLtAZaZ=umode &lt;+|-&gt;&lt;A-Za-z&gt;:  Установить или снять режим пользователя.
versionNickSendCtcpVersionRequestTo=версия [nick]: послать CTCP VERSION запрос пользователю
voiceLtNick1GtNick2GrantChannel=voice &lt;псевдоним1&gt; [псевдоним2] …:  Дать пользователю статус голоса на канале. Вы должны быть оператором канала для этого.
wallopsLtMessageGtIfYouDon=грохот &lt;message&gt;:  Если вы не знаете, что это, вероятно вы не сможете это использовать.
whoisServerLtNickGtGetInformation=whois [сервер] &lt;псевдоним&gt;:  Получить информацию о пользователе.
whowasLtNickGtGetInformationOn=whowas &lt;псевдоним&gt;:  Получить информацию о пользователе, вышедшем из сети.
replyTimeFromSeconds=Время ответа от %s: %lu секунд
pong=PONG
ctcpPingReply=Ответ CTCP PING
