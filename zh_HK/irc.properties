actionLtActionToPerformGtPerform=action &lt;要執行的動作&gt;：執行一個動作。
awayMessageSetAnAwayMessageOr=away [訊息]：設定一個離開訊息，或者在離開時不指定任何訊息。
ctcpNickMsgSendsCtcpMsgTo=ctcp &lt;網名&gt; &lt;訊息&gt;：向指定的網名送出 ctcp 訊息
chanservSendACommandToChanserv=chanserv：送出一個指令到 chanserv
deopLtNick1GtNick2RemoveChannel=deop &lt;網名1&gt; [網名2] …：移除某個人的「頻道管理者」權限。你必須具有「頻道管理者」的權限才能夠執行這個動作。
devoiceLtNick1GtNick2RemoveChannel=devoice &lt;網名1&gt; [網名2] …：移除某個人的「發言」權限。禁止某些人在頻道中發表不當的言論。你必須具有「頻道管理者」的權限才能夠執行這個動作。
inviteLtNickGtRoomInviteSomeone=invite &lt網名&gt; [聊天室]：邀請某個人來加入你所指定的頻道，或是目前你所在的頻道。
jLtRoom1GtRoom2Key1Key2=j &lt;聊天室1&gt;[,聊天室2][,…] [密碼匙1[,密碼匙2][,…]]：以指定的密碼匙（如有給予並有需要）加入所指定的聊天室。
joinLtRoom1GtRoom2Key1Key2=join &lt;聊天室1&gt;[,聊天室2][,…] [密碼匙1[,密碼匙2][,…]]：以指定的密碼匙（如有給予並有需要）加入所指定的聊天室。
kickLtNickGtMessageRemoveSomeone=kick &lt;網名&gt; [訊息]：將某個使用者踢出頻道。你必需具有「頻道管理者」權限才能夠執行這個動作。
listDisplayAListOfChatRooms=list：列出目前在網絡上的聊天室清單。<i>請注意，有些伺服器會在你執行了這個動作之後，強行中止你的連線。</i>
meLtActionToPerformGtPerform=me &lt;要執行的動作&gt;：執行一個動作。
memoservSendACommandToMemoserv=memoserv：送出一個指令到 memoserv
modeLtGtLtAZaZ=mode &lt;+|-&gt;&lt;A-Za-z&gt; &lt;網名|頻道&gt;：設定或解除頻道╱使用者模式。
msgLtNickGtLtMessageGt=msg &lt;網名&gt; &lt;訊息&gt;：送出一個私人訊息給指定的使用者（避免傳送到公眾頻道中）。
namesChannelListTheUsersCurrentlyIn=names [頻道]：列出目前在頻道中的使用者清單。
nickLtNewNicknameGtChangeYour=nick &lt;新網名&gt;：改變你的網名。
nickservSendACommandToNickserv=nickserv：送出一個指令到 nickserv
noticeLtTargetLtSendANotice=notice &lt;對象&gt;：向使用者或頻道發出告示。
opLtNick1GtNick2GrantChannel=op &lt;網名&gt; [網名] …：賦與某個使用者「頻道管理者」權限。你必須具有「頻道管理者」權限才能執行這個動作。
operwallLtMessageGtIfYouDon=operwall &lt;訊息&gt;：如果你不知道這是幹什麼用的，你可能沒有辦法使用這個指令。
operservSendACommandToOperserv=operserv：送出一個指令到 operserv
partRoomMessageLeaveTheCurrentChannel=part [頻道] [訊息]：離開目前的頻道或指定的頻道。指定頻道時可同時指定送出的訊息。
pingNickAsksHowMuchLagA=ping [網名]：查詢某一個使用者的網絡回應速度（或在沒有指定使用者時，查詢伺服器的回應速度）。
queryLtNickGtLtMessageGt=query &lt;網名&gt; &lt;訊息&gt;：送出一個私人訊息給指定的使用者（避免發送到公眾頻道）。
quitMessageDisconnectFromTheServerWith=quit [訊息]：自伺服器離線，並送出指定的訊息。
quoteSendARawCommandToThe=quote […]：送出一個 RAW 指令到伺服器。
removeLtNickGtMessageRemoveSomeone=remove &lt;網名&gt; [訊息]：將某個使用者踢出頻道。你必須具有「頻道管理者」的權限才能夠執行這個動作。
timeDisplaysTheCurrentLocalTimeAt=time：顯示 IRC 伺服器所在地之本地時間。
topicNewTopicViewOrChangeThe=topic [新主題]：檢視或修改頻道主題
umodeLtGtLtAZaZ=umode &lt;+|-&gt;&lt;A-Za-z&gt;：設定或解除使用者模式。
versionNickSendCtcpVersionRequestTo=version [網名]：給使用者送出 CTCP VERSION 要求
voiceLtNick1GtNick2GrantChannel=voice &lt;網名&gt; [網名] …：賦與使用者的「發言」權限。你必須具有「頻道管理者」的權限才能執行這個動作。
wallopsLtMessageGtIfYouDon=wallops &lt;message&gt;：如果你不知道這是幹什麼用的，你可能就沒有辦法使用它了。
whoisServerLtNickGtGetInformation=whois [伺服器名稱] &lt;網名&gt;：取得使用者資訊。
whowasLtNickGtGetInformationOn=whowas &lt;網名&gt;：取得已離線的使用者的資訊。
replyTimeFromSeconds=%s 回答需時：%lu 秒
pong=PONG
ctcpPingReply=CTCP PING 回答
disconnected=停止連線。
