actionLtActionToPerformGtPerform=action &lt;実行するアクション&gt;:  アクションを実行します
awayMessageSetAnAwayMessageOr=away [メッセージ]:  離席中のメッセージをセットする、または離席中から戻ったことを示すためにセットしたメッセージを解除します
