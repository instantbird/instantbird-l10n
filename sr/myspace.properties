# TODO: icons for each zap
# Lots of comments for translators:
# Zap means "to strike suddenly and forcefully as if with a
# projectile or weapon."  This term often has an electrical
# connotation, for example, "he was zapped by electricity when
# he put a fork in the toaster."
zap=Убиј
hasZappedYou=%s Вас је убио(ла)!
zapping=Убијам %s…

# Whack means "to hit or strike someone with a sharp blow"
whack=Лупи
hasWhackedYou=%s Вас је лупио(ла)!
whacking=Лупам %s…

# Torch means "to set on fire."  Don't worry, this doesn't
# make a whole lot of sense in English, either.  Feel free
# to translate it literally.
torch=Спржи
hasTorchedYou=%s Вас је спржио(ла)!
torching=Пржим %s…

# Smooch means "to kiss someone, often enthusiastically"
smooch=Цмокни
hasSmoochedYou=%s Вас је цмокнуо(ла)!
smooching=Цмокћем %s…

# A hug is a display of affection; wrapping your arms around someone
hug=Грли
hasHuggedYou=%s Вас је загрлио(ла)!
hugging=Грлим %s…

# Slap means "to hit someone with an open/flat hand"
slap=Ошамари
hasSlappedYou=%s Вас је ошамарио!
slapping=Шамарам %s…

# Goose means "to pinch someone on their butt"
goose=Ваћари
hasGoosedYou=%s Вас ваћари!
goosing=Ваћарим %s…

# A high-five is when two people's hands slap each other
# in the air above their heads.  It is done to celebrate
# something, often a victory, or to congratulate someone.
highFive=Баци петицу
hasHighFivedYou=%s Вам баца петицу!
highFiving=Бацам петицу за %s…

# We're not entirely sure what the MySpace people mean by
# this... but we think it's the equivalent of "prank."  Or, for
# someone to perform a mischievous trick or practical joke.
punk=Одалами
hasPunkDYou=%s Вас је одаламио(ла)!
punking=Одаламљујем %s…

# Raspberry is a slang term for the vibrating sound made
# when you stick your tongue out of your mouth with your
# lips closed and blow.  It is typically done when
# gloating or bragging.  Nowadays it's a pretty silly
# gesture, so it does not carry a harsh negative
# connotation.  It is generally used in a playful tone
# with friends.
raspberry=Прди устима
hasRaspberriedYou=%s Вам прди устима!
raspberrying=Прдим устима на %s…
