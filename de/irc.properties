actionLtActionToPerformGtPerform=action &lt;Aktion&gt;:  Führe eine Aktion durch.
awayMessageSetAnAwayMessageOr=away [Nachricht]:  Setzen Sie eine Abwesenheitsnachricht. Verwenden Sie keine Nachricht, um wieder zurückzukehren.
ctcpNickMsgSendsCtcpMsgTo=ctcp <nick> <anfrage>: Sendet CTCP-Anfrage an nick.
chanservSendACommandToChanserv=chanserv: Sendet ein Kommando zum Chanserv
deopLtNick1GtNick2RemoveChannel=deop &lt;Nick1&gt; [Nick2] …:  Entferne den Kanal-Operator-Status von jemanden. Sie müssen hierfür selbst Operator des Kanals sein.
devoiceLtNick1GtNick2RemoveChannel=devoice &lt;Nick1&gt; [Nick2] …:  Entferne den Voice-Status von jemanden. Dies verbietet ihm zu sprechen, wenn der Kanal moderiert wird (+). Sie müssen hierfür selbst Operator des Kanals sein.
inviteLtNickGtRoomInviteSomeone=invite &lt;Nick&gt; [Raum]:  Jemanden in den angegeben Kanal oder in den aktuellen Kanal einladen.
jLtRoom1GtRoom2Key1Key2=j &lt;Raum1&gt;[,Raum2][,…] [Schlüssel1[,Schlüssel2][,…]]:  Einen oder mehrere Kanäle angeben, optional jeden mit einem Kanal-Schlüssel, falls dieser benötigt wird.
joinLtRoom1GtRoom2Key1Key2=join &lt;Raum1&gt;[,Raum2][,…] [Schlüssel1[,Schlüssel2][,…]]:  Einen oder mehrere Räume angeben, optional jeden mit einem Kanal-Schlüssel, falls dieser benötigt wird.
kickLtNickGtMessageRemoveSomeone=kick &lt;Nick&gt; [Nachricht]:  Kickt jemanden aus dem Kanal. Sie müssen hierfür selbst Operator des Kanals sein.
listDisplayAListOfChatRooms=list:  Zeige eine Liste der Chaträume in diesem Netzwerk. <i>Warnung: Einige Server trennen die Verbindung, wenn Sie dieses Kommando eingeben.</i>
meLtActionToPerformGtPerform=me &lt;Aktion&gt;:  Eine Aktion durchführen.
memoservSendACommandToMemoserv=memoserv: Sendet ein Kommando zum Memoserv
modeLtGtLtAZaZ=mode &lt;+|-&gt;&lt;A-Za-z&gt; &lt;Nick|Kanal&gt;:  Kanal- oder Benutzermodi setzen oder zurücknehmen.
msgLtNickGtLtMessageGt=msg &lt;nick&gt; &lt;nachricht&gt;:  Sendet eine private Nachricht an einen Benutzer (im Gegensatz zum Kanal).
namesChannelListTheUsersCurrentlyIn=names [Kanal]:  Listet die Benutzer im aktuellen Kanal auf.
nickLtNewNicknameGtChangeYour=nick &lt;new nickname&gt;:  Ihren Spitznamen ändern.
nickservSendACommandToNickserv=nickserv: Sendet ein Kommando zum Nickserv
noticeLtTargetLtSendANotice=notice &lt;Ziel&gt;:  Sende eine Notiz an einen Benutzer oder an einen Kanal.
opLtNick1GtNick2GrantChannel=op &lt;Nick1&gt; [Nick2] …:  Erteile den Operator-Status an jemanden. Sie müssen hierfür selbst Operator des Kanals sein.
operwallLtMessageGtIfYouDon=operwall &lt;Nachricht&gt;:  Wenn Sie nicht wissen, was dies ist, brauchen Sie es wahrscheinlich nicht.
operservSendACommandToOperserv=operserv: Sendet ein Kommandos zum Operserv
partRoomMessageLeaveTheCurrentChannel=part [Raum] [Nachricht]:  Verlässt den aktuellen Kanal oder den angegebenen Kanal mit einer optionalen Nachricht.
pingNickAsksHowMuchLagA=ping [Nick]:  Ermittelt die Verzögerung eines Benutzers (oder eines Server, wenn kein Benutzer angegeben wird) über ein Ping.
queryLtNickGtLtMessageGt=query &lt;Nick&gt; &lt;Nachricht&gt;:  Sendet eine private Nachricht an einen Benutzer (im Gegensatz zu einem Kanal).
quitMessageDisconnectFromTheServerWith=quit [Nachricht]:  Trennung vom Server mit einer optionalen Nachricht.
quoteSendARawCommandToThe=quote […]:  Sendet den Text im Rohformat an den Server.
removeLtNickGtMessageRemoveSomeone=remove &lt;Nick&gt; [Nachricht]:  Jemanden aus dem Raum entfernen. Sie müssen hierfür selbst Operator des Kanals sein.
timeDisplaysTheCurrentLocalTimeAt=time: Zeigt die aktuelle Lokalzeit auf dem IRC-Server an.
topicNewTopicViewOrChangeThe=topic [neues Thema]:  Ansehen oder Ändern des Themas des Kanals.
umodeLtGtLtAZaZ=umode &lt;+|-&gt;&lt;A-Za-z&gt;:  Benutzermodus setzen oder zurücknehmen.
versionNickSendCtcpVersionRequestTo=version [Benutzer]: sende CTCP VERSION-Anfrage an einen Benutzer
voiceLtNick1GtNick2GrantChannel=voice &lt;Nick1&gt; [Nick2] …:  Vergibt jemanden den Voice-Status. Dies erlaubt ihm auch dann noch zu sprechen, wenn der Kanal moderiert wird (+m). Sie müssen hierfür selbst Operator des Kanals sein.
wallopsLtMessageGtIfYouDon=wallops &lt;Nachricht&gt;:  Wenn Sie diese Funktion nicht kennen, brauchen sie sie wahrscheinlich nicht.
whoisServerLtNickGtGetInformation=whois [Server] &lt;Nick&gt;:  Informationen zu einem Benutzer abrufen.
whowasLtNickGtGetInformationOn=whowas &lt;Nick&gt;:  Informationen zu einem abgemeldeten Benutzer abrufen.
